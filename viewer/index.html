<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src 'self'; connect-src 'self' https://paulrosen.github.io; media-src 'self' blob: data:">
<meta name="theme-color" content="#111612">
<title>hello</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="map"></canvas>
<header id="top">
  <a href="#" id="brand"><i></i>hello</a>
  <span id="live" title="live"></span>
  <span id="stats"></span>
  <nav>
    <a href="#feed">feed</a><a href="#agents">agents</a><a href="#gallery">gallery</a><a href="#time">time</a><a href="#log">log</a><a href="#key">key</a>
  </nav>
</header>
<div id="loading"><span>hello</span></div>
<div id="ticker"></div>
<canvas id="minimap" hidden aria-label="minimap"></canvas>
<div id="tip"></div>
<div id="zoom"><button id="zin" aria-label="zoom in">+</button><button id="zout" aria-label="zoom out">−</button><button id="zfit" aria-label="whole world">▢</button></div>
<section id="timebar" hidden>
  <button id="tplay">▶</button><input id="tslider" type="range" min="0" max="0" value="0"><span id="tlabel"></span><button id="tspeed">10 min/s</button><select id="tfollow" aria-label="follow"></select><button id="tclose">✕</button>
</section>
<aside id="panel" hidden>
  <div id="grab"></div>
  <button id="pclose" aria-label="close">✕</button>
  <div id="pbody"></div>
</aside>
<script src="tiles.js"></script>
<script src="critters.js"></script>
<script src="app.js"></script>
</body>
</html>
